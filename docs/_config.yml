title: Scout
description: Self-hosted video security with motion, object, and face detection. No cloud, no monthly fees.

# Pinned so a theme release can't change the site unexpectedly.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Custom scheme: _sass/color_schemes/scout.scss (styles in _sass/custom/custom.scss)
color_scheme: scout
logo: /assets/images/hawk-wing.png
favicon_ico: /favicon.ico

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Navigation (page order is set with nav_order in each page's front matter)
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "GitHub":
    - "https://github.com/jonoton/scout"
aux_links_new_tab: true

footer_content: 'Scout is open source under the <a href="https://github.com/jonoton/scout/blob/master/LICENSE">MIT License</a>.'

# Callouts. Usage: put {: .note } (or .tip / .important / .warning) on the line
# above a paragraph. Colors are restyled in _sass/custom/custom.scss.
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: yellow
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
