<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
   <title>Scout</title>
   <link rel="icon" type="image/x-icon" href="favicon.ico">
   <link rel="stylesheet" href="css/bootstrap.min.css">
   <link rel="stylesheet" href="css/bootstrap-grid.min.css">
   <link rel="stylesheet" href="css/bootstrap-reboot.min.css">
   <link rel="stylesheet" href="css/scout.css">

   <!-- Core Local Vendor Libraries (Offline) -->
   <script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
   <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
   <script type="text/javascript" src="js/js.cookie.min.js"></script>
   <script type="text/javascript" src="js/pako.min.js"></script>
   <script type="text/javascript" src="js/crypto-js.min.js"></script>

   <!-- Application Scripts -->
   <script type="text/javascript" src="js/stringtoarray.js"></script>
   <script type="text/javascript" src="js/blobtostring.js"></script>
   <script type="text/javascript" src="js/login.js"></script>
   <script type="text/javascript" src="js/index.js"></script>
</head>

<body>
   <!-- Embedded SVG Icons for 100% Offline Capability -->
   <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol id="icon-play" viewBox="0 0 24 24">
         <path d="M8 5v14l11-7z" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
         <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
      </symbol>
      <symbol id="icon-fullscreen" viewBox="0 0 24 24">
         <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
      </symbol>
      <symbol id="icon-compress" viewBox="0 0 24 24">
         <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z" />
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
         <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
      </symbol>
      <symbol id="icon-eye-off" viewBox="0 0 24 24">
         <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
         <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
      </symbol>
      <symbol id="icon-video" viewBox="0 0 24 24">
         <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24">
         <path d="M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
         <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
      </symbol>
   </svg>

   <!-- Navigation Bar -->
   <nav class="navbar navbar-expand navbar-dark navbar-scout bgColorLight">
      <a class="navbar-brand" href="#">
         <img src="images/hawk-wing.png" alt="Scout">
         <span>Scout</span>
      </a>

      <div class="ml-auto d-flex align-items-center">
         <button id="login-button" type="button" class="d-none btn btn-sm btn-light font-weight-bold" data-toggle="modal"
            data-target="#login-modal">Login</button>
         <button id="logout-button" type="button" class="d-none btn btn-sm btn-outline-light font-weight-bold">Logout</button>
      </div>
   </nav>

   <!-- Metrics & Status Bar (Near Grid Area) -->
   <div class="metrics-bar">
      <div class="d-flex align-items-center flex-wrap">
         <div id="status-pill" class="status-pill mr-3">
            <span class="status-dot"></span>
            <span id="status">Connecting...</span>
         </div>

         <!-- Grid Layout Dropdown -->
         <div class="dropdown d-inline-block mr-2" id="grid-dropdown-container">
            <button class="grid-filter-btn dropdown-toggle" type="button" id="gridDropdownBtn"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" title="Grid Layout">
               <svg style="width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; margin-right: 4px;">
                  <use href="#icon-grid"></use>
               </svg>
               <span>Grid:</span>
               <span class="badge badge-cams ml-1" id="grid-current-label">Auto</span>
            </button>
            <div class="dropdown-menu dropdown-menu-dark" id="grid-dropdown-menu" aria-labelledby="gridDropdownBtn">
               <div class="dropdown-header">Grid Columns</div>
               <button type="button" class="dropdown-item grid-dropdown-item active" data-cols="auto">
                  Auto (Responsive)
               </button>
               <button type="button" class="dropdown-item grid-dropdown-item" data-cols="1">
                  1 Column
               </button>
               <button type="button" class="dropdown-item grid-dropdown-item" data-cols="2">
                  2 Columns
               </button>
               <button type="button" class="dropdown-item grid-dropdown-item" data-cols="3">
                  3 Columns
               </button>
               <button type="button" class="dropdown-item grid-dropdown-item" data-cols="4">
                  4 Columns
               </button>
            </div>
         </div>

         <!-- Cameras Filter Dropdown -->
         <div class="dropdown d-inline-block" id="cameras-filter-container">
            <button class="grid-filter-btn dropdown-toggle" type="button" id="camerasDropdownBtn"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" title="Show / Hide Cameras">
               <svg style="width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; margin-right: 4px;">
                  <use href="#icon-video"></use>
               </svg>
               <span>Cameras</span>
               <span class="badge badge-cams ml-1" id="cameras-badge">0/0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-dark" id="cameras-dropdown-menu" aria-labelledby="camerasDropdownBtn">
               <div class="dropdown-header">Toggle Cameras</div>
               <div id="cameras-checkboxes-list">
                  <!-- Populated by index.js -->
               </div>
               <div class="dropdown-divider"></div>
               <button type="button" class="dropdown-item dropdown-action-btn" id="dropdown-show-all">
                  <svg class="mr-2" style="width: 13px; height: 13px; fill: currentColor;"><use href="#icon-eye"></use></svg>
                  Show All
               </button>
               <button type="button" class="dropdown-item dropdown-action-btn text-danger-hover" id="dropdown-clear-all">
                  <svg class="mr-2" style="width: 13px; height: 13px; fill: currentColor;"><use href="#icon-eye-off"></use></svg>
                  Clear All
               </button>
            </div>
         </div>
      </div>
      <div id="memory-body" class="memory-gauge">
         <span class="d-none d-sm-inline">System Memory:</span>
         <span id="memory" class="badge-ram">Loading RAM...</span>
      </div>
   </div>

   <!-- Main Content Grid -->
   <main id="content-body" class="container-fluid p-0">
      <div id="monitor-container" class="cols-auto">
         <!-- Camera cards dynamically populated by index.js -->
      </div>
   </main>

   <!-- Login Modal -->
   <div id="login-modal" class="modal fade" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title">Sign In to Scout</h5>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
               <form role="form" autocomplete="off" onsubmit="return false;">
                  <div class="form-group">
                     <label for="login_user" class="text-muted small">Username</label>
                     <input id="login_user" type="text" class="form-control" placeholder="Enter username" />
                  </div>
                  <div class="form-group">
                     <label for="login_pwd" class="text-muted small">Password</label>
                     <input id="login_pwd" type="password" class="form-control" placeholder="Enter password" />
                  </div>
               </form>
               <div id="bad_user" class="d-none text-danger small mt-2">Invalid username and/or password.</div>
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
               <button id="login-btn" type="button" class="btn btn-primary btn-sm">Login</button>
            </div>
         </div>
      </div>
   </div>

   <!-- Choose Verification Method Modal -->
   <div id="login-choose-modal" class="modal fade" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title">Two-Factor Verification</h5>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
               <form role="form" autocomplete="off" onsubmit="return false;">
                  <div class="form-group">
                     <label for="login_choose" class="text-muted small">Select Verification Method:</label>
                     <select name="login_choose" id="login_choose" class="form-control">
                     </select>
                  </div>
               </form>
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
               <button id="login-choose-btn" type="button" class="btn btn-primary btn-sm">Select</button>
            </div>
         </div>
      </div>
   </div>

   <!-- Passcode Verification Modal -->
   <div id="login-passcode-modal" class="modal fade" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
         <div class="modal-content">
            <div class="modal-header">
               <h5 class="modal-title">Enter Verification Passcode</h5>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
               <form role="form" autocomplete="off" onsubmit="return false;">
                  <div class="form-group">
                     <label for="login_passcode" class="text-muted small">One-Time Passcode</label>
                     <input id="login_passcode" class="form-control" placeholder="Passcode" />
                  </div>
               </form>
               <div id="login-passcode-duration" class="font-italic text-muted small mt-1"></div>
               <div id="bad_passcode" class="d-none text-danger small mt-2">Invalid or expired passcode.</div>
            </div>
            <div class="modal-footer">
               <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
               <button id="login-passcode-btn" type="button" class="btn btn-primary btn-sm">Verify</button>
            </div>
         </div>
      </div>
   </div>

   <!-- Stream Quality & Resolution Settings Modal -->
   <div id="stream-settings-modal" class="modal fade" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
         <div class="modal-content">
            <div class="modal-header">
               <div class="d-flex align-items-center">
                  <svg style="width: 18px; height: 18px; fill: var(--scout-blue); margin-right: 8px;">
                     <use href="#icon-settings"></use>
                  </svg>
                  <h5 class="modal-title">Stream Settings: <span id="modal-stream-cam-name" class="text-info font-weight-bold"></span></h5>
               </div>
               <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
               <!-- Camera Selector (when multiple cameras exist) -->
               <div class="form-group mb-3" id="modal-camera-select-group">
                  <label for="modal-stream-camera-select" class="text-muted small font-weight-bold text-uppercase">Camera</label>
                  <select id="modal-stream-camera-select" class="form-control form-control-sm">
                  </select>
               </div>

               <!-- Resolution -->
               <div class="form-group mb-3">
                  <label class="text-muted small font-weight-bold text-uppercase d-block mb-2">Resolution (Width)</label>
                  <div class="modal-pill-grid modal-res-pills">
                     <button type="button" class="stream-pill-btn" data-res="320">320p</button>
                     <button type="button" class="stream-pill-btn" data-res="480">480p</button>
                     <button type="button" class="stream-pill-btn active" data-res="640">640p (Default)</button>
                     <button type="button" class="stream-pill-btn" data-res="960">960p</button>
                     <button type="button" class="stream-pill-btn" data-res="1280">720p HD</button>
                     <button type="button" class="stream-pill-btn" data-res="1920">1080p FHD</button>
                  </div>
               </div>

               <!-- Quality -->
               <div class="form-group mb-2">
                  <label class="text-muted small font-weight-bold text-uppercase d-block mb-2">JPEG Quality</label>
                  <div class="modal-pill-grid modal-quality-pills">
                     <button type="button" class="stream-pill-btn" data-quality="25">25% (Low)</button>
                     <button type="button" class="stream-pill-btn active" data-quality="50">50% (Standard)</button>
                     <button type="button" class="stream-pill-btn" data-quality="75">75% (High)</button>
                     <button type="button" class="stream-pill-btn" data-quality="90">90% (Ultra)</button>
                  </div>
               </div>

               <div class="small text-muted mt-3 font-italic">
                  Changes take effect immediately on the live video stream.
               </div>
            </div>
            <div class="modal-footer justify-content-between">
               <div>
                  <button type="button" class="btn btn-outline-info btn-sm mr-2" id="modal-btn-apply-all" title="Apply these settings to all cameras">
                     Apply to All Cameras
                  </button>
                  <button type="button" class="btn btn-outline-secondary btn-sm" id="modal-btn-reset-default" title="Reset this camera to 640p @ 50%">
                     Reset Default
                  </button>
               </div>
               <button type="button" class="btn btn-primary btn-sm px-3" data-dismiss="modal">Done</button>
            </div>
         </div>
      </div>
   </div>
</body>

</html>
